name: Coverity Scan

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

# Least privilege; fork PRs get a read-only token and no secrets anyway.
permissions:
  contents: read
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest
    # Without the token (fork PRs, pushes to forks) the job only builds;
    # Coverity scans fork code once it is merged.
    env:
      HAS_TOKEN: ${{ secrets.COVERITY_SCAN_TOKEN != '' }}
    steps:
    - uses: actions/checkout@v7
    - name: Install build tools and dependencies
      run: DEBIAN_FRONTEND=noninteractive sudo apt-get -y install build-essential libdvbcsa-dev libssl-dev zlib1g-dev libxml2-dev cmake
    - name: cmake
      run: |
        cmake -B build .
    - name: make
      if: env.HAS_TOKEN != 'true'
      run: make -C build
    - uses: vapier/coverity-scan-action@v1
      if: env.HAS_TOKEN == 'true'
      with:
        project: minisatip2
        token: ${{ secrets.COVERITY_SCAN_TOKEN }}
        email: reply+AB6SAEPNLEJSCE2WJ37GDNF6TC2NXEVBNHHDIEHQTY@reply.github.com
        command: make -C build
        version: ${{ github.event.pull_request.head.sha || github.sha }}
