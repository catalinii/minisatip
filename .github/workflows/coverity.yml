name: Coverity Scan

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Install build tools and dependencies
      run: DEBIAN_FRONTEND=noninteractive sudo apt-get -y install build-essential libdvbcsa-dev libssl-dev zlib1g-dev libxml2-dev cmake
    - name: cmake
      run: |
        cmake -B build .
    # Fork PRs cannot access the scan token: only same-repo runs
    # upload, while forks still validate compilation below.
    - uses: vapier/coverity-scan-action@v1
      if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
      with:
        project: minisatip2
        token: ${{ secrets.COVERITY_SCAN_TOKEN }}
        email: reply+AB6SAEPNLEJSCE2WJ37GDNF6TC2NXEVBNHHDIEHQTY@reply.github.com
        command: make -C build
    - name: Build without Coverity upload (no scan token on fork PRs)
      if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
      run: make -C build
